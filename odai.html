<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30日チャレンジのお題｜ローレンス</title>
  <meta name="description" content="54歳、Claude Code で30日チャレンジ。毎日のお題を、日ごとに切り替えて表示します。">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&display=swap">
  <style>
    :root { --night: #0b1222; --deep: #121b33; --ink: #e9edf6; --sub: #a9b3c9; --gold: #e8c77a; --green: #8fcdb0; --line: rgba(255,255,255,.12); }
    * { box-sizing: border-box; }
    /* 文字はすべて1.5倍（ふつうの16px → 24px） */
    html { scroll-behavior: smooth; font-size: 150%; }
    body { margin: 0; background: var(--night); color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif; line-height: 1.8; -webkit-font-smoothing: antialiased; }
    a { color: var(--gold); }

    /* ---------- いちばん上：写真が左右に流れるスライド ---------- */
    .hero { position: relative; height: 46svh; min-height: 380px; max-height: 520px; overflow: hidden; touch-action: pan-y; }
    .track { display: flex; height: 100%; transition: transform 1.1s cubic-bezier(.65,0,.35,1); }
    .slide { position: relative; flex: 0 0 100%; height: 100%; overflow: hidden; color: #fff; }
    .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.12) translateX(2%); transition: transform 7s ease-out; }
    .slide.on img { transform: scale(1.02) translateX(-2%); }
    .slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,12,24,.65) 0%, rgba(8,12,24,.2) 45%, rgba(8,12,24,.88) 100%); }
    .cap { position: absolute; left: 22px; right: 22px; bottom: 56px; z-index: 2; opacity: 0; transform: translateY(14px); transition: opacity .8s .5s, transform .8s .5s; }
    .slide.on .cap { opacity: 1; transform: none; }
    .cap small { display: block; font-size: .74rem; letter-spacing: .2em; color: var(--gold); }
    .cap b { font-size: 1rem; font-weight: 600; }
    .title { position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 34px 22px 0; text-align: center; color: inherit; text-decoration: none; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
    .title h1 { margin: 0; font-family: "Shippori Mincho B1", serif; font-size: min(8.4vw, 3.2rem); line-height: 1.3; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
    .title .en { margin: 2px 0 0; font-size: .7rem; letter-spacing: .35em; color: var(--sub); }
    .title .lead { margin: 8px 0 0; font-size: .8rem; }
    .dots { position: absolute; z-index: 4; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 10px; }
    .dots button { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 99px; background: rgba(255,255,255,.45); cursor: pointer; transition: width .4s, background .4s; }
    .dots button.on { width: 28px; background: var(--gold); }

    main { max-width: 720px; margin: 0 auto; padding: 0 22px 40px; }
    .back { display: inline-block; margin: 18px 0 0; font-size: .88rem; text-decoration: none; }
    .today-label { text-align: center; color: var(--sub); margin: 14px 0 16px; }

    /* ---------- お題のカード（写真をうすく敷いた、ガラスのような板） ---------- */
    .card { position: relative; overflow: hidden; border-radius: 20px; padding: 26px 22px 22px; background: var(--deep); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.45); transition: border-color .4s; }
    .card::before { content: ""; position: absolute; inset: 0; background: url(img/desk.jpg) center/cover; opacity: .22; }
    .card > * { position: relative; }
    .card.done { border-color: var(--green); }
    .card .week { color: var(--gold); font-size: .78rem; letter-spacing: .06em; margin: 0; }
    .card .day { font-family: "Shippori Mincho B1", serif; font-size: 2rem; font-weight: 800; margin: 0; line-height: 1.4; }
    .card .date { color: var(--green); font-size: .8rem; margin: 0 0 10px; }
    .card .task { font-size: 1rem; line-height: 1.8; margin: 10px 0 14px; }
    .card .result { color: var(--sub); font-size: .82rem; margin: 0; }
    .card .result b { color: var(--gold); font-weight: normal; }
    .stamp { position: absolute; top: 18px; right: 16px; z-index: 2; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--green); border-radius: 50%; color: var(--green); font-weight: 800; font-size: .9rem; transform: rotate(-14deg); background: rgba(11,18,34,.6); animation: pon .35s ease-out; }
    .stamp[hidden] { display: none; }
    @keyframes pon { from { transform: rotate(-14deg) scale(1.6); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }

    /* ---------- ボタン ---------- */
    /* 「やった」は大きく1段目に、「前の日」「次の日」は2段目の左右に */
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .controls #doneBtn { grid-column: 1 / -1; order: -1; }
    .controls #next { justify-self: end; }
    .controls #prev { justify-self: start; }
    .sub-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0 0; }
    .btn { font: inherit; font-size: .82rem; color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 99px; padding: 10px 14px; cursor: pointer; transition: border-color .3s, color .3s, background .3s; }
    .btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .btn:disabled { opacity: .3; cursor: default; }
    .btn[hidden] { display: none; }
    .btn.primary { border-color: var(--gold); background: rgba(232,199,122,.14); color: var(--gold); font-weight: 600; padding: 12px 22px; }
    .btn.primary.is-done { border-color: var(--green); background: rgba(143,205,176,.15); color: var(--green); }

    /* ---------- 進み具合 ---------- */
    .progress { color: var(--sub); font-size: .82rem; text-align: center; margin: 26px 0 8px; }
    .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--green)); transition: width .6s; }

    h2 { margin: 44px 0 16px; font-family: "Shippori Mincho B1", serif; font-size: 1.3rem; font-weight: 800; letter-spacing: .06em; }
    h2::after { content: ""; display: block; width: 40px; height: 2px; margin-top: 10px; background: var(--gold); }
    .days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    @media (min-width: 640px) { .days { grid-template-columns: repeat(10, 1fr); } }
    .days button { font: inherit; font-size: .8rem; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--sub); cursor: pointer; transition: background .3s, border-color .3s; }
    .days button.done { background: rgba(143,205,176,.22); border-color: var(--green); color: #e2f4ea; }
    .days button.today { outline: 2px solid var(--gold); outline-offset: 2px; color: var(--ink); }
    .days button.current { background: rgba(232,199,122,.25); color: var(--ink); }
    .days button.later { opacity: .4; }
    .memo { color: var(--sub); font-size: .74rem; margin-top: 14px; line-height: 1.7; }

    footer { padding: 48px 0 0; text-align: center; font-size: .78rem; color: var(--sub); }
    @media (prefers-reduced-motion: reduce) {
      .track, .slide img, .cap, .bar span { transition: none !important; }
      .stamp { animation: none; }
    }
  </style>
</head>
<body>
  <header class="hero" id="hero">
    <div class="track" id="track">
      <div class="slide on">
        <img src="img/library.jpg" alt="" fetchpriority="high">
        <div class="cap"><small>WEEK 1</small><b>第1週　文章とファイルを扱う</b></div>
      </div>
      <div class="slide">
        <img src="img/toronto.jpg" alt="" loading="lazy">
        <div class="cap"><small>WEEK 2</small><b>第2週　データと自動化</b></div>
      </div>
      <div class="slide">
        <img src="img/window.jpg" alt="" loading="lazy">
        <div class="cap"><small>WEEK 3</small><b>第3週　自分のページを作って公開する</b></div>
      </div>
      <div class="slide">
        <img src="img/sea.jpg" alt="" loading="lazy">
        <div class="cap"><small>WEEK 4</small><b>第4週　作ったものを、人に差し出す形にする</b></div>
      </div>
    </div>
    <a class="title" href="index.html" title="トップページ（自己紹介）にもどる">
      <h1>30日チャレンジのお題</h1>
      <p class="en">30-Day Challenge</p>
      <p class="lead">54歳、Claude Code で30日チャレンジ</p>
    </a>
    <div class="dots" id="dots" aria-label="写真の切りかえ"></div>
  </header>

  <main>
    <a class="back" href="index.html">← 自己紹介にもどる</a>

    <p class="today-label" id="todayLabel"></p>

    <article class="card" id="card" aria-live="polite">
      <span class="stamp" id="stamp" hidden>やった</span>
      <p class="week" id="week"></p>
      <p class="day" id="day"></p>
      <p class="date" id="date"></p>
      <p class="task" id="task"></p>
      <p class="result" id="result"></p>
    </article>

    <div class="controls">
      <button class="btn" id="prev" type="button">← 前の日</button>
      <button class="btn primary" id="doneBtn" type="button">やった</button>
      <button class="btn" id="next" type="button">次の日 →</button>
    </div>
    <p class="sub-controls">
      <button class="btn" id="toNext" type="button">次のお題へ</button>
      <button class="btn" id="bulkBtn" type="button"></button>
    </p>

    <p class="progress" id="progress"></p>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>

    <h2>30日の一覧</h2>
    <div class="days" id="days"></div>
    <p class="memo">「やった」の印は、このブラウザの中だけに覚えておきます。ほかのスマホやパソコンには伝わりません。</p>

    <footer>
      <p>2026年11月　Claude Code と一緒に作りました<br>写真：Unsplash</p>
    </footer>
  </main>

  <script>
    // ---- 30日分のお題 ----
    const WEEKS = {
      1: "第1週　文章とファイルを扱う",
      2: "第2週　データと自動化",
      3: "第3週　自分のページを作って公開する",
      4: "第4週　作ったものを、人に差し出す形にする",
      5: "最後の2日",
    };
    const DAYS = [
      ["作業用フォルダ「ai-challenge」を作り、Claude Code を起動。「このフォルダの説明書を作って」と頼む", "作業フォルダと説明書（README.md）"],
      ["note のエッセイ1本をテキストファイルで置き、要約と「読者が引っかかりそうな箇所」を別ファイルに書かせる", "要約と指摘のファイル"],
      ["エッセイ10本をまとめて読ませ、各回のタイトル案を三つずつ一覧にする", "タイトル案の一覧表"],
      ["原稿の誤字脱字と表記ゆれを直させ、「どこをどう直したか」の差分を見る", "修正版の原稿と修正箇所の一覧"],
      ["エッセイ1本から X の投稿文を五つ作らせ、140字以内かどうかを「数えるプログラム」で確かめさせる", "投稿文と文字数チェックの結果"],
      ["「CLAUDE.md」という設定ファイルに自分の文体ルール（三則など）を書き、そのルールで推敲させる", "自分専用のルールファイル"],
      ["その日の作業を振り返り、note の下書きとして書かせる", "note 記事の下書き"],
      ["note 記事のタイトル、公開日、スキ数を表（CSV）に書き出し、「よく読まれた記事の共通点」を分析させる", "集計表と分析メモ"],
      ["8日目の表から、スキ数の推移をグラフ画像にする", "グラフの画像"],
      ["写真フォルダのコピーを作り、ファイル名を「撮影日_連番」に一括で変える", "整理された写真フォルダ"],
      ["写真をまとめて note の見出し画像の大きさに縮小・切り抜きする", "見出し用の画像一式"],
      ["Word や PDF の原稿を、まとめてテキストに変換し、文字数を一覧にする", "変換したテキストと文字数表"],
      ["「今日やったこと」を一行入力すると、日付つきで記録ファイルに追記される、小さなプログラムを作らせる", "自分専用の記録ツール"],
      ["この週に作ったプログラムの説明書を書かせ、「どういう仕組みで動いているか」を初心者向けに説明させる", "プログラムの説明書"],
      ["自己紹介のページを1枚だけ作らせて、ブラウザで開いてみる", "自己紹介ページ"],
      ["色・文字・余白を変えて、スマホでも読みやすくする。「もっと静かな雰囲気に」のように、言葉で指示する", "デザインを整えたページ"],
      ["エッセイ連載の目次ページを作り、各回の note 記事へリンクを張る", "連載の目次ページ"],
      ["この30日チャレンジのお題を、日ごとに切り替えて表示するページを作る", "お題ページ（第4週の土台になる）"],
      ["Git（ファイルを変えた記録を残す仕組み）を、Claude Code に説明してもらいながら使い始める", "変えた記録が残る作業フォルダ"],
      ["GitHub にファイルを上げて、GitHub Pages（無料でページを公開できる仕組み）で公開する", "公開されたページの URL"],
      ["公開したページをスマホで開き、気になるところを三つ直して、もう一度公開する", "直したあとの公開ページ"],
      ["チラシを1枚印刷し、スマホで紙の QR コードを読んでみる。気になるところを直す", "試し刷りと直したチラシ"],
      ["架空の喫茶店のページを例にして、「スマホで見て直したほうがいいところ三つ」の診断書を作る", "無料診断の見本（紙1枚）"],
      ["23日目の診断書を、どのお店にも使えるひな形にする", "診断書のひな形"],
      ["お見積りと請求書のひな形を作り、金額を入れると合計が出るようにする", "見積書・請求書のひな形"],
      ["LINE やメールで問い合わせが来たときの返事の文例を、場面ごとに作る", "返事の文例集"],
      ["30日分のお題を、アプリが読めるデータの形（JSON：データを決まった書き方で並べたファイル）にまとめる", "お題のデータファイル"],
      ["お題ページに「やった」の記録と、何日続いたかを出す", "続いた日数が見えるお題ページ"],
      ["28日目のページをスマホで1日使ってみて、気になるところを三つ直す", "直したお題ページ"],
      ["30日間を振り返り、次の30日の計画を立てる", "まとめのエッセイと次の計画"],
    ];
    const TOTAL = 30;
    const KEY = "challenge30-done";

    // ---- 「やった」の印を覚えておく（日付を一緒に残す。使えないブラウザでも、ページは動くようにする） ----
    // 形：{ "1": "2026-11-13", "2": "2026-11-14", ... }
    let done = {};
    try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { done = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function jpDate(s) {
      if (typeof s !== "string") return "";
      const [y, m, d] = s.split("-").map(Number);
      return `${m}月${d}日`;
    }

    // ---- 次のお題＝まだ「やった」がついていない、いちばん若い日 ----
    const READY = DAYS.length;                 // お題が決まっている日数
    function nextDay() {
      for (let i = 1; i <= READY; i++) if (!done[i]) return i;
      return Math.min(READY + 1, TOTAL);        // 決まっているお題を全部やったとき
    }
    const clampDay = n => Math.min(TOTAL, Math.max(1, n));
    let current = nextDay();

    const $ = id => document.getElementById(id);

    function render() {
      const n = current;
      const nx = nextDay();
      const item = DAYS[n - 1];
      const week = n <= 28 ? Math.ceil(n / 7) : 5;
      $("week").textContent = WEEKS[week];
      $("day").textContent = n + "日目";
      $("task").textContent = item ? item[0] : "このお題は、これから決まります。";
      $("result").innerHTML = item ? "できあがるもの：<b></b>" : "";
      if (item) $("result").querySelector("b").textContent = item[1];

      const isDone = !!done[n];
      $("date").textContent = isDone ? (jpDate(done[n]) ? jpDate(done[n]) + "にやった" : "やった") : "";
      $("date").hidden = !isDone;
      $("card").classList.toggle("done", isDone);
      $("stamp").hidden = !isDone;
      $("doneBtn").textContent = isDone ? "✓ やった（取り消す）" : "やった";
      $("doneBtn").classList.toggle("is-done", isDone);
      $("doneBtn").disabled = !item;
      $("prev").disabled = n <= 1;
      $("next").disabled = n >= TOTAL;
      $("toNext").hidden = n === nx;

      // まとめて「やった」：今見ている日より前に、まだやっていない日があるときだけ出す
      let missing = 0;
      for (let i = 1; i <= Math.min(n, READY); i++) if (!done[i]) missing++;
      $("bulkBtn").hidden = !item || n === 1 || missing === 0 || (missing === 1 && !done[n] && n === nx);
      $("bulkBtn").textContent = `1〜${n}日目を、まとめて「やった」にする`;

      const doneCount = Object.keys(done).filter(k => done[k]).length;
      if (doneCount === 0) $("todayLabel").textContent = "まずは 1日目 から。";
      else if (nx > READY) $("todayLabel").textContent = "用意されているお題は、全部やりました。";
      else $("todayLabel").textContent = `次は ${nx}日目 です`;

      $("progress").textContent = `やった日：${doneCount} / ${TOTAL}日`;
      $("bar").style.width = (doneCount / TOTAL * 100) + "%";

      const box = $("days");
      box.innerHTML = "";
      for (let i = 1; i <= TOTAL; i++) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = i;
        b.setAttribute("aria-label", `${i}日目${done[i] ? "（やった）" : ""}`);
        if (done[i]) b.classList.add("done");
        if (i === nx) b.classList.add("today");
        if (i === n) b.classList.add("current");
        if (!DAYS[i - 1]) b.classList.add("later");
        b.addEventListener("click", () => { current = i; render(); });
        box.appendChild(b);
      }
    }

    $("prev").addEventListener("click", () => { current = clampDay(current - 1); render(); });
    $("next").addEventListener("click", () => { current = clampDay(current + 1); render(); });
    $("toNext").addEventListener("click", () => { current = nextDay(); render(); });
    $("doneBtn").addEventListener("click", () => {
      if (done[current]) delete done[current]; else done[current] = todayStr();
      save(); render();
    });
    $("bulkBtn").addEventListener("click", () => {
      const n = Math.min(current, READY);
      if (!confirm(`1〜${n}日目に、まとめて「やった」の印をつけますか？`)) return;
      const t = todayStr();
      for (let i = 1; i <= n; i++) if (!done[i]) done[i] = t;
      save(); render();
    });
    render();
  </script>

  <script>
    // いちばん上の写真を、左右にすべらせて切りかえる（5秒ごと。指でスワイプしても切りかわる）
    (function () {
      var track = document.getElementById('track');
      var slides = track.children;
      var dots = document.getElementById('dots');
      var n = slides.length, i = 0, timer = null;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      for (var k = 0; k < n; k++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', (k + 1) + '枚目の写真');
        (function (k) { b.onclick = function () { go(k); restart(); }; })(k);
        dots.appendChild(b);
      }
      function go(k) {
        i = (k + n) % n;
        track.style.transform = 'translateX(' + (-100 * i) + '%)';
        for (var j = 0; j < n; j++) {
          slides[j].classList.toggle('on', j === i);
          dots.children[j].classList.toggle('on', j === i);
        }
      }
      function restart() {
        clearInterval(timer);
        if (!still) timer = setInterval(function () { go(i + 1); }, 5000);
      }
      var x0 = null;
      var hero = document.getElementById('hero');
      hero.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      hero.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 40) { go(dx < 0 ? i + 1 : i - 1); restart(); }
        x0 = null;
      });
      go(0); restart();
    })();
  </script>
  <!-- 右側についてくる「トップへ」：右の細い線が、いまページのどのあたりかを金色で示す。丸いボタンを押すと、いちばん上へ戻る -->
  <style>
    .rail { position: fixed; z-index: 50; top: 18vh; right: 6px; width: 4px; height: 52vh; border-radius: 4px; background: rgba(255,255,255,.12); opacity: 0; transition: opacity .4s; pointer-events: none; }
    .rail i { display: block; width: 100%; height: 0; border-radius: 4px; background: #e8c77a; }
    .totop { position: fixed; z-index: 51; right: 14px; bottom: 18px; width: 64px; height: 64px; border: 1px solid rgba(232,199,122,.6); border-radius: 50%; background: rgba(11,18,34,.82); color: #e8c77a; font: 600 13px/1.1 "Hiragino Sans", "Yu Gothic UI", sans-serif; letter-spacing: .05em; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transform: translateY(16px); transition: opacity .35s, transform .35s; pointer-events: none; }
    .totop span { display: block; font-size: 20px; line-height: 1; margin-bottom: 2px; }
    .show .rail, .show .totop { opacity: 1; }
    .show .totop { transform: none; pointer-events: auto; }
    @media (prefers-reduced-motion: reduce) { .rail, .totop { transition: none; } }
  </style>
  <div id="totopBox">
    <div class="rail" aria-hidden="true"><i id="railFill"></i></div>
    <button class="totop" type="button" aria-label="ページのいちばん上へ戻る"><span>▲</span>トップ</button>
  </div>
  <script>
    (function () {
      var box = document.getElementById('totopBox'), fill = document.getElementById('railFill');
      function update() {
        var max = document.documentElement.scrollHeight - innerHeight;
        var y = scrollY;
        box.classList.toggle('show', y > 300);
        fill.style.height = (max > 0 ? Math.min(100, y / max * 100) : 0) + '%';
      }
      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
      box.querySelector('.totop').addEventListener('click', function () { scrollTo({ top: 0, behavior: 'smooth' }); });
      update();
    })();
  </script>
  <!-- 日本語と英語の切りかえ（右上にずっと出ている）。押すと、同じページの同じ場所の、もう一方の言葉のページへ移る。
       ja は、このページの言葉（ja か en）。作るときに入れかえる -->
  <style>
    .langsw { position: fixed; z-index: 60; top: 8px; right: 8px; display: flex; align-items: center; gap: 2px; padding: 2px 2px 2px 8px; border: 1px solid rgba(232,199,122,.5); border-radius: 99px; background: rgba(11,18,34,.72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 6px 18px rgba(0,0,0,.4); font: 600 11px/1 "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif; letter-spacing: .04em; }
    .langsw svg { width: 14px; height: 14px; margin-right: 3px; flex: 0 0 auto; }
    .langsw a { display: block; padding: 6px 10px; border-radius: 99px; color: #cfd6e6; text-decoration: none; transition: background .25s, color .25s; }
    .langsw a:hover { color: #e8c77a; }
    .langsw a.on { background: #e8c77a; color: #0b1222; cursor: default; }
    .hero .title { margin-top: 16px; }  /* 右上の切りかえと、題名が重ならないように */
    @media (prefers-reduced-motion: reduce) { .langsw a { transition: none; } }
  </style>
  <nav class="langsw" id="langSw" aria-label="言語 / Language">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e8c77a" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg>
    <a data-lang="ja" lang="ja" href="#">日本語</a>
    <a data-lang="en" lang="en" href="#">EN</a>
  </nav>
  <script>
    (function () {
      var cur = 'ja';
      var file = location.pathname.split('/').pop() || 'index.html';
      var other = cur === 'ja' ? 'en/' + file : '../' + file;
      document.querySelectorAll('#langSw a').forEach(function (a) {
        if (a.dataset.lang === cur) {
          a.classList.add('on');
          a.setAttribute('aria-current', 'page');
          a.addEventListener('click', function (e) { e.preventDefault(); });
          return;
        }
        a.href = other;
        a.addEventListener('click', function (e) {
          // 金色の印を、押したほうへ移してから、ページを移る（同じ場所 #oxford なども持っていく）
          e.preventDefault();
          document.querySelector('#langSw a.on').classList.remove('on');
          a.classList.add('on');
          setTimeout(function () { location.href = other + location.hash; }, 180);
        });
      });
    })();
  </script>
</body>
</html>
